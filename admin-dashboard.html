<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Command Center</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <template id="pageContent">
    <section class="command-hero">
      <div>
        <div class="eyebrow">TODAY'S OPERATING PICTURE</div>
        <h2>Turn fresh permit signals into contractor action.</h2>
        <p>Start with new opportunities, assign ownership, and move material demand toward pricing.</p>
      </div>
      <div class="command-actions">
        <a class="btn btn-dark" href="opportunity-board.html">Open Pipeline</a>
        <a class="btn" href="assignments.html">Assign Work</a>
        <button class="btn btn-primary" id="runRefreshBtn" type="button">Refresh Data</button>
      </div>
    </section>

    <div id="refreshCard"></div>

    <div class="dashboard-section-head">
      <div><span class="eyebrow">PRIORITIES</span><h3>What needs action now</h3></div>
      <span class="muted">Click any card to open its work queue</span>
    </div>
    <div id="primaryKpis" class="priority-grid"></div>

    <div class="dashboard-split">
      <section>
        <div class="dashboard-section-head">
          <div><span class="eyebrow">SOURCE HEALTH</span><h3>Jurisdiction freshness</h3></div>
        </div>
        <div id="freshness"></div>
      </section>
      <section>
        <div class="dashboard-section-head">
          <div><span class="eyebrow">PIPELINE</span><h3>Recent refresh activity</h3></div>
        </div>
        <div id="pipeline"></div>
      </section>
    </div>

    <div class="dashboard-section-head">
      <div><span class="eyebrow">LATEST SIGNALS</span><h3>Recent opportunities</h3></div>
      <a href="opportunity-board.html">View full pipeline →</a>
    </div>
    <div id="opps"></div>

    <details class="system-totals">
      <summary>System totals and administration</summary>
      <div id="secondaryKpis" class="compact-kpi-grid"></div>
      <div id="actions" class="stack" style="flex-direction:row;flex-wrap:wrap;gap:8px;margin-top:14px"></div>
    </details>
  </template>
  <script src="portal-common.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
