name: Launch smoke checks

on:
  pull_request:
  push:
    branches:
      - chatgpt/contractor-crm-launch
      - cursor/morning-refresh-and-login-fix

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml requests argon2-cffi playwright
      - name: Install browser test runtime
        run: python -m playwright install --with-deps chromium
      - name: Check Python syntax
        run: python -m compileall -q pipeline scripts
      - name: Run complete test suite, including desktop and mobile browser flows
        run: python -m pytest pipeline/tests -q
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 2 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify local page assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          missing = []
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for ref in re.findall(r'''(?:src|href)=["']([^"'?#]+)''', text):
                  if ref.startswith(('http://', 'https://', '/', '#', 'mailto:', 'tel:')):
                      continue
                  if not Path(ref).exists():
                      missing.append(f"{page}: {ref}")
          if missing:
              raise SystemExit("Missing local assets:\n" + "\n".join(missing))
          print("All local HTML assets are present.")
          PY
