<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Opportunities</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <template id="pageContent">
    <div class="filters">
      <input type="search" id="fq" placeholder="Search address, city, company…" />
      <select id="flifecycle"><option value="">All stages</option></select>
      <select id="fscore">
        <option value="">Any score</option>
        <option value="80">80+</option><option value="60">60+</option><option value="40">40+</option>
      </select>
      <select id="fcontact">
        <option value="">Any contact status</option>
        <option value="available">Contact info available</option>
        <option value="missing">Needs contact enrichment</option>
      </select>
      <select id="fage">
        <option value="365">Past 12 months</option>
        <option value="90">Past 90 days</option>
        <option value="30">Past 30 days</option>
        <option value="">All history</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="pager" id="pager"></div>
  </template>
  <script src="portal-common.js"></script>
  <script src="opportunities.js"></script>
</body>
</html>
