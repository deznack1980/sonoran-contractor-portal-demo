<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Verified Contractor Directory</title><link rel="stylesheet" href="portal.css" /></head>
<body><template id="pageContent">
  <section class="metric-grid" id="contractorStats"></section>
  <section class="panel">
    <div class="section-head"><div><h2>Verified contractors</h2><p>Canonical companies with explicit contractor evidence</p></div><span class="badge green">Release 15.4 · Secured API</span></div>
    <div class="filters contractor-filters">
      <input type="search" id="contractorSearch" placeholder="Search company or license…" />
      <select id="contractorContact"><option value="">All contact states</option><option value="available">Contact ready</option><option value="missing">Needs contact research</option></select>
      <select id="contractorSort"><option value="priority">Highest opportunity</option><option value="permits">Most permits</option><option value="recent">Most recent permit</option><option value="materials">Material opportunity</option><option value="name">Company name</option></select>
      <label class="check-filter"><input type="checkbox" id="contractorMulti" /> Multi-jurisdiction only</label>
    </div>
    <div id="contractorResults"></div><div class="pager" id="contractorPager"></div>
  </section>
</template><script src="portal-common.js"></script><script src="contractors.js"></script></body></html>
