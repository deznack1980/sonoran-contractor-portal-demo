      aggregate PDFs. Stays pending.

  - slug: surprise_az
    name: Surprise
    state: AZ
    status: pending
    connector_type: null
    endpoint_url: null
    resource_id: null
    notes: >
      Surprise Hub still has no per-permit building-permit dataset.
