  - slug: goodyear_az
    name: Goodyear
    state: AZ
    status: connected
    connector_type: arcgis_hub
    endpoint_url: https://maps.goodyearaz.gov/server/rest/services/Accela/Construction_Permits/MapServer/0
    resource_id: "0"
    notes: >
      CORRECTED from prior pending assessment. Goodyear publishes a public
