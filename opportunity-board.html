<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CorridorIQ — Opportunity Pipeline</title>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="opportunity-board.css" />
</head>
<body>
  <template id="pageContent">
    <section class="pipeline-hero">
      <div>
        <span class="eyebrow">REVENUE EXECUTION</span>
        <h2>Turn verified project signals into action</h2>
        <p>Prioritized contractor opportunities with contact readiness, likely material scope, and the next commercial step in one view.</p>
      </div>
      <div class="pipeline-hero-actions">
        <a class="btn btn-dark" href="opportunities.html">Project Records</a>
        <a class="btn btn-primary" href="material-list-intake.html">New Material List</a>
      </div>
    </section>

    <div id="boardSummary" class="pipeline-kpis"></div>

    <section class="pipeline-controls" aria-label="Opportunity pipeline controls">
      <div class="board-filters">
        <input id="boardSearch" type="search" placeholder="Search contractor, address, permit, city…" />
        <select id="boardScore">
          <option value="60">Score 60+</option>
          <option value="70">Score 70+</option>
          <option value="80">Score 80+</option>
          <option value="90">Score 90+</option>
        </select>
        <select id="boardOwner">
          <option value="">All contractor opportunities</option>
          <option value="mine">Assigned to me</option>
          <option value="unassigned">Unassigned</option>
        </select>
        <select id="boardContact">
          <option value="">Any contact status</option>
          <option value="available">Contact ready</option>
          <option value="missing">Needs enrichment</option>
        </select>
        <button id="boardReset" class="btn btn-ghost" type="button">Reset</button>
      </div>
      <div id="boardStageNav" class="pipeline-stage-nav" role="tablist" aria-label="Pipeline stage"></div>
    </section>

    <div class="pipeline-queue-head">
      <div><span class="eyebrow">PRIORITY QUEUE</span><h3 id="queueTitle">All active opportunities</h3></div>
      <div id="boardNotice" class="pipeline-result-count"></div>
    </div>
    <div id="board" class="pipeline-queue"></div>
  </template>
  <script src="portal-common.js"></script>
  <script src="opportunity-board.js"></script>
</body>
</html>
